# CI for XOOPS Support (PhpStorm plugin)
# Pattern inspired by php-hammer:
# https://github.com/hammer-tools/php-hammer/blob/master/.github/workflows/gradle.yml
name: Gradle

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: gradle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permissions
        run: chmod +x ./gradlew

      - name: Build plugin
        # Same task set as php-hammer: check + verify + package
        run: ./gradlew check verifyPlugin buildPlugin --stacktrace

      - name: Upload plugin distribution
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xoops-support-plugin
          path: build/distributions/*.zip
          if-no-files-found: error
