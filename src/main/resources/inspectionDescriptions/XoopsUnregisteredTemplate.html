<!doctype html>
<html>
<body>
A <code>.tpl</code> file under the module <code>templates/</code> or <code>blocks/</code>
directory is not listed in <code>xoops_version.php</code>, so Smarty cannot
<code>display()</code> it as a registered module template.
<p>Theme overrides under <code>themes/</code> are ignored.</p>
<p>Quick-fix appends a <code>$modversion['templates'][]</code> entry to the manifest.</p>
</body>
</html>
